<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Charlotte vs The Dark Matter Crisis</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;color:#eef;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
  #wrap{position:relative;height:100%}
  #top{
    position:absolute;left:0;right:0;top:0;z-index:6;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:linear-gradient(180deg, rgba(30,30,60,.55), rgba(10,10,18,.30));
    border-bottom:1px solid rgba(255,255,255,.10);
    user-select:none;
  }
  #logo{font-weight:900;letter-spacing:.9px;font-size:12px}
  #hud{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11px}
  .pill{padding:4px 8px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(255,255,255,.04)}
  canvas{position:absolute;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px);
    image-rendering:pixelated;display:block;touch-action:none}
  #controls{position:absolute;left:0;right:0;bottom:0;height:44%;z-index:10;pointer-events:none;}
  .pad,.btns{position:absolute;bottom:10px;pointer-events:auto;}
  .pad{left:10px;width:46%;max-width:360px;height:190px;}
  .btns{right:10px;width:48%;max-width:520px;height:190px;display:flex;gap:10px;justify-content:flex-end;align-items:flex-end;flex-wrap:wrap;}
  .tbtn{
    width:78px;height:78px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
    color:rgba(255,255,255,.94);
    font-weight:900;font-size:12px;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  .tbtn:active{transform:translateY(1px);background:rgba(255,255,255,.10);}
  .small{width:62px;height:62px;border-radius:16px;font-size:11px;}
  .wide{width:150px;height:62px;border-radius:16px;font-size:11px;}
  .row{display:flex;gap:10px;align-items:flex-end;}
  #hintRotate{
    position:absolute;inset:52px 0 0 0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.70);text-align:center;padding:20px;
  }
  #hintRotate .card{
    width:min(520px,92vw);
    border:1px solid rgba(255,255,255,.18);
    background:rgba(10,10,18,.80);
    border-radius:18px;
    padding:18px;
  }
  #hintRotate h2{margin:0 0 10px 0;font-size:16px}
  #hintRotate p{margin:8px 0;font-size:12px;opacity:.92;line-height:1.35}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="logo">CHARLOTTE vs THE DARK MATTER CRISIS</div>
    <div id="hud">
      <span class="pill" id="hp">HP: 100</span>
      <span class="pill" id="combo">HITS: 0</span>
      <span class="pill" id="power">POWER: 0/10</span>
      <span class="pill" id="stage">WAVE: 1/3</span>
      <span class="pill" id="score">SCORE: 0</span>
    </div>
  </div>

  <canvas id="c"></canvas>

  <div id="controls">
    <div class="pad">
      <div class="row">
        <div class="tbtn" data-btn="left">◀</div>
        <div class="tbtn" data-btn="right">▶</div>
        <div class="tbtn small" data-btn="jump">JUMP</div>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;">
        <div class="tbtn wide" data-btn="mute">MUTE</div>
      </div>
    </div>
    <div class="btns">
      <div class="tbtn" data-btn="attack">ATTACK</div>
      <div class="tbtn" data-btn="special">SPECIAL</div>
      <div class="tbtn small" data-btn="dash">DASH</div>
    </div>
  </div>

  <div id="hintRotate">
    <div class="card">
      <h2>Tip</h2>
      <p>For the most “arcade” feel, rotate your phone to landscape. It still works in portrait, just smaller.</p>
      <p>Tap anywhere to continue.</p>
    </div>
  </div>
</div>

<script>
(() => {
  // ============================================================
  // VIEW / CANVAS (virtual 16:9 with letterbox)
  // ============================================================
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const VIEW_W = 960;
  const VIEW_H = 540;

  let view = { s: 1, ox: 0, oy: 0, dpr: 1 };

  function resize(){
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const cssW = canvas.clientWidth;
    const cssH = canvas.clientHeight;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);

    const sx = canvas.width / VIEW_W;
    const sy = canvas.height / VIEW_H;
    const sInt = Math.floor(Math.min(sx, sy));
    const s = Math.max(1, sInt);

    const ox = Math.floor((canvas.width - VIEW_W * s) / 2);
    const oy = Math.floor((canvas.height - VIEW_H * s) / 2);

    view = { s, ox, oy, dpr };
    ctx.imageSmoothingEnabled = false;

    // rotate hint (optional)
    const hint = document.getElementById("hintRotate");
    const portrait = window.innerHeight > window.innerWidth;
    hint.style.display = portrait ? "flex" : "none";
  }
  window.addEventListener("resize", resize);
  resize();

  document.getElementById("hintRotate").addEventListener("pointerdown", ()=>{
    document.getElementById("hintRotate").style.display="none";
  }, {passive:true});

  // ============================================================
  // UI
  // ============================================================
  const UI = {
    hp: document.getElementById("hp"),
    combo: document.getElementById("combo"),
    power: document.getElementById("power"),
    stage: document.getElementById("stage"),
    score: document.getElementById("score"),
  };

  // ============================================================
  // HELPERS
  // ============================================================
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const nowS = ()=>performance.now()/1000;

  function aabb(ax,ay,aw,ah,bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function wrapLines(text, maxW, fontPx){
    ctx.font = `${fontPx}px ui-monospace`;
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for(const w of words){
      const test = line ? (line+" "+w) : w;
      if(ctx.measureText(test).width <= maxW) line = test;
      else { if(line) lines.push(line); line = w; }
    }
    if(line) lines.push(line);
    return lines;
  }

  // ============================================================
  // AUDIO (Option 1: WebAudio synthwave-8bit)
  // ============================================================
  const SND = (() => {
    let ac=null, master=null, muted=false, started=false;

    // simple synth voices
    function ensure(){
      if(ac) return;
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.22;
      master.connect(ac.destination);
    }
    function resume(){
      ensure();
      if(ac.state==="suspended") ac.resume();
      started=true;
    }
    function setMuted(m){
      muted=m;
      if(master) master.gain.value = muted?0:0.22;
    }
    function toggleMute(){ setMuted(!muted); }

    function tone({type="sawtooth", f=440, dur=0.12, vol=0.10, slide=0, pan=0}={}){
      if(!started) return;
      const t0=ac.currentTime, t1=t0+dur;

      const o=ac.createOscillator();
      o.type=type;
      o.frequency.setValueAtTime(f,t0);
      if(slide!==0){
        const ft = Math.max(40, f+slide);
        o.frequency.exponentialRampToValueAtTime(ft,t1);
      }

      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t1);

      const p=ac.createStereoPanner();
      p.pan.setValueAtTime(pan,t0);

      o.connect(g); g.connect(p); p.connect(master);
      o.start(t0); o.stop(t1);
    }

    function noise({dur=0.10, vol=0.06, hp=1000, pan=0}={}){
      if(!started) return;
      const t0=ac.currentTime, t1=t0+dur;
      const n = Math.floor(ac.sampleRate*dur);
      const buf = ac.createBuffer(1,n,ac.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*0.75;

      const src = ac.createBufferSource();
      src.buffer = buf;

      const f = ac.createBiquadFilter();
      f.type = "highpass";
      f.frequency.value = hp;

      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t1);

      const p=ac.createStereoPanner();
      p.pan.setValueAtTime(pan,t0);

      src.connect(f); f.connect(g); g.connect(p); p.connect(master);
      src.start(t0); src.stop(t1);
    }

    // music: 3 states (title/stage/boss+reveal)
    let musicTimer=null, mode="title", step=0;

    const progTitle = [
      [261.63, 329.63, 392.00, 523.25], // Cmaj
      [220.00, 277.18, 329.63, 440.00], // A min-ish
      [196.00, 246.94, 293.66, 392.00], // G
      [174.61, 220.00, 261.63, 349.23], // F
    ];

    const progStage = [
      [196.00, 246.94, 293.66, 392.00], // G
      [207.65, 261.63, 311.13, 415.30], // G# / Ab
      [174.61, 220.00, 261.63, 349.23], // F
      [220.00, 277.18, 329.63, 440.00], // A
    ];

    const progBoss = [
      [164.81, 207.65, 246.94, 329.63], // E
      [146.83, 185.00, 220.00, 293.66], // D
      [130.81, 164.81, 196.00, 261.63], // C
      [174.61, 220.00, 261.63, 349.23], // F (resolve later)
    ];

    function chord(prog, idx){
      const c = prog[idx % prog.length];
      // pad-ish
      tone({type:"triangle", f:c[0], dur:0.18, vol:0.035, pan:-0.15});
      tone({type:"triangle", f:c[1], dur:0.18, vol:0.030, pan:0.10});
      tone({type:"triangle", f:c[2], dur:0.18, vol:0.028, pan:0.15});
      // lead arp
      const a = c[3];
      tone({type:"square", f:a, dur:0.08, vol:0.030, pan:-0.05});
      tone({type:"square", f:a*1.5, dur:0.06, vol:0.018, pan:0.08});
      // bass pulse
      tone({type:"sawtooth", f:c[0]/2, dur:0.07, vol:0.040, slide:-20, pan:0});
    }

    function musicStart(){
      if(musicTimer) return;
      musicTimer = setInterval(()=>{
        if(muted || !started) return;
        if(mode==="title") chord(progTitle, step++);
        else if(mode==="stage") chord(progStage, step++);
        else if(mode==="boss") chord(progBoss, step++);
        else if(mode==="reveal"){
          // warm resolve
          const c=[261.63,329.63,392.00,523.25]; // C
          tone({type:"triangle", f:c[0], dur:0.22, vol:0.030, pan:-0.10});
          tone({type:"triangle", f:c[1], dur:0.22, vol:0.028, pan:0.05});
          tone({type:"triangle", f:c[2], dur:0.22, vol:0.026, pan:0.10});
          tone({type:"square", f:c[3], dur:0.10, vol:0.020, pan:0.00});
          step++;
        }
      }, 130);
    }

    function musicStop(){ if(musicTimer) clearInterval(musicTimer); musicTimer=null; }
    function setMode(m){ if(mode!==m){ mode=m; step=0; } }

    const fx = {
      start: ()=>{ tone({type:"square", f:440, dur:0.07, vol:0.06}); tone({type:"square", f:659, dur:0.09, vol:0.05}); },
      jump: ()=> tone({type:"triangle", f:520, dur:0.07, vol:0.06, slide:-160}),
      jab: ()=> tone({type:"square", f:310, dur:0.05, vol:0.08, slide:-60}),
      hit: ()=> { noise({dur:0.06, vol:0.06, hp:900}); tone({type:"square", f:220, dur:0.05, vol:0.05, slide:-80}); },
      hurt: ()=> { tone({type:"sawtooth", f:170, dur:0.12, vol:0.08, slide:-70}); noise({dur:0.08, vol:0.05, hp:600}); },
      power: ()=> { tone({type:"square", f:784, dur:0.08, vol:0.05}); tone({type:"square", f:988, dur:0.08, vol:0.05}); },
      special: ()=> { tone({type:"sawtooth", f:240, dur:0.18, vol:0.09, slide:380}); noise({dur:0.12, vol:0.06, hp:1200}); },
      slam: ()=> { tone({type:"sawtooth", f:90, dur:0.14, vol:0.10, slide:-20}); noise({dur:0.10, vol:0.05, hp:500}); },
      sparkle: ()=> { tone({type:"triangle", f:880, dur:0.06, vol:0.04, slide:120}); tone({type:"triangle", f:1174, dur:0.08, vol:0.03}); }
    };

    return { ensure, resume, setMuted, toggleMute, musicStart, musicStop, setMode, fx };
  })();

  // ============================================================
  // INPUT (touch buttons)
  // ============================================================
  const v = {left:false,right:false,jump:false,attack:false,special:false,dash:false,
             attackHit:false,specialHit:false,jumpHit:false,dashHit:false,muteHit:false};

  function clearEdges(){
    v.attackHit=v.specialHit=v.jumpHit=v.dashHit=v.muteHit=false;
  }

  const activePointers = new Map();
  function setBtn(name, down){
    if(name==="left") v.left=down;
    else if(name==="right") v.right=down;
    else if(name==="jump"){ if(down && !v.jump) v.jumpHit=true; v.jump=down; }
    else if(name==="attack"){ if(down && !v.attack) v.attackHit=true; v.attack=down; }
    else if(name==="special"){ if(down && !v.special) v.specialHit=true; v.special=down; }
    else if(name==="dash"){ if(down && !v.dash) v.dashHit=true; v.dash=down; }
    else if(name==="mute"){ if(down) v.muteHit=true; }
  }

  for(const el of [...document.querySelectorAll("[data-btn]")]){
    el.addEventListener("pointerdown",(e)=>{
      el.setPointerCapture(e.pointerId);
      const name=el.getAttribute("data-btn");
      activePointers.set(e.pointerId,name);
      setBtn(name,true);
      e.preventDefault();
    },{passive:false});
    el.addEventListener("pointerup",(e)=>{
      const name=activePointers.get(e.pointerId);
      if(name) setBtn(name,false);
      activePointers.delete(e.pointerId);
      e.preventDefault();
    },{passive:false});
    el.addEventListener("pointercancel",(e)=>{
      const name=activePointers.get(e.pointerId);
      if(name) setBtn(name,false);
      activePointers.delete(e.pointerId);
    });
  }

  // start on first tap anywhere
  canvas.addEventListener("pointerdown", ()=>{
    SND.ensure();
    SND.resume();
    SND.musicStart();
  }, {passive:true});

  // ============================================================
  // WORLD / GAME STATE
  // ============================================================
  const WORLD_W = 6400;
  const GROUND_Y = 418;

  const cam = {x:0};
  const particles = [];

  const game = {
    state: "title", // title, wave, boss, cutscene, reward
    wave: 1,
    msg: "",
    msgT: 0,
    shakeT: 0,
    shakeM: 0,
    score: 0,
    cutT: 0,
    revealT: 0,
    bossRevealStep: 0,
  };

  function setMsg(t, s=1.2){ game.msg=t; game.msgT=s; }

  // ============================================================
  // HERO (Charlotte)
  // ============================================================
  const hero = {
    x: 120, y: GROUND_Y-74,
    w: 40, h: 74,
    vx: 0, vy: 0,
    facing: 1,
    onGround: true,
    hp: 100,
    inv: 0,
    animT: 0,
    actionT: 0,
    dashT: 0,

    // combo / power
    hits: 0,
    power: 0,         // counts consecutive hits
    powerReady: false,
    tookDamage: false
  };

  function damageHero(d){
    if(hero.inv>0 || game.state==="reward") return;
    hero.hp = clamp(hero.hp-d, 0, 100);
    hero.inv = 0.7;
    hero.vx = -hero.facing*220;
    hero.vy = -360;
    hero.tookDamage = true;
    hero.hits = 0;
    hero.power = 0;
    hero.powerReady = false;
    SND.fx.hurt();
    shake(0.18, 8);
    spawnImpact(hero.x+hero.w/2, hero.y+hero.h/2, 18, "red");
    if(hero.hp<=0){
      game.state="reward";
      game.revealT=0;
      game.bossRevealStep=3;
      SND.setMode("reveal");
    }
  }

  // ============================================================
  // ENEMIES (animated sprites via pixel patterns)
  // ============================================================
  const enemies = [];
  function makeEnemy(type, x){
    const brute = type==="brute";
    return {
      type, x, y: GROUND_Y-(brute?84:66),
      w: brute?52:40, h: brute?84:66,
      vx:0, vy:0,
      hp: brute?80:36,
      stun:0,
      atkT: rnd(0.4, 1.3),
      hitFlash:0,
      animT:rnd(0,10),
      dead:false
    };
  }

  // ============================================================
  // BOSS
  // ============================================================
  let boss = null;
  function spawnBoss(){
    boss = {
      x: WORLD_W-620, y: GROUND_Y-210,
      w: 170, h: 210,
      hp: 520,
      atkT: 1.4,
      slamWind: 0,
      phase: 1,
      dead:false,
      hitFlash:0,
      animT:0
    };
    setMsg("FINAL BOSS: THE DARK MATTER MONARCH", 1.8);
    SND.setMode("boss");
  }

  // ============================================================
  // PARTICLES
  // ============================================================
  function spawnImpact(x,y,n,color){
    for(let i=0;i<n;i++){
      particles.push({x,y,vx:rnd(-260,260),vy:rnd(-420,-120),t:0,life:rnd(0.25,0.8),color});
    }
  }
  function spawnButterflies(x,y,n){
    for(let i=0;i<n;i++){
      particles.push({x,y,vx:rnd(-60,60),vy:rnd(-120,-40),t:0,life:rnd(0.8,1.6),color:"butterfly",spin:rnd(0,6.28)});
    }
  }

  function shake(t,m){ game.shakeT=t; game.shakeM=m; }

  // ============================================================
  // WAVES
  // ============================================================
  function startWave(w){
    game.wave = w;
    enemies.length=0;
    const baseX = hero.x + 620;
    if(w===1){
      enemies.push(makeEnemy("grunt", baseX+0));
      enemies.push(makeEnemy("grunt", baseX+90));
      enemies.push(makeEnemy("grunt", baseX+180));
      setMsg("WAVE 1: DARK MATTER GRUNTS", 1.4);
    } else if(w===2){
      enemies.push(makeEnemy("grunt", baseX+0));
      enemies.push(makeEnemy("brute", baseX+140));
      enemies.push(makeEnemy("grunt", baseX+300));
      enemies.push(makeEnemy("grunt", baseX+390));
      setMsg("WAVE 2: MUTANT SWARM", 1.4);
    } else if(w===3){
      enemies.push(makeEnemy("brute", baseX+60));
      enemies.push(makeEnemy("grunt", baseX+220));
      enemies.push(makeEnemy("grunt", baseX+310));
      enemies.push(makeEnemy("brute", baseX+470));
      enemies.push(makeEnemy("grunt", baseX+560));
      setMsg("WAVE 3: HIGH STREET PANIC", 1.4);
    }
  }

  // ============================================================
  // COLLISION / ATTACKS
  // ============================================================
  function heroHitbox(){
    const w=46, h=44;
    return {
      x: hero.x + (hero.facing===1 ? hero.w-6 : -w+6),
      y: hero.y + 18,
      w, h
    };
  }

  function doAttack(){
    if(hero.actionT>0 || hero.dashT>0) return;
    hero.actionT = 0.18;
    SND.fx.jab();
    const hb = heroHitbox();

    let hitSomething=false;

    for(const e of enemies){
      if(e.dead) continue;
      if(aabb(hb.x,hb.y,hb.w,hb.h, e.x,e.y,e.w,e.h)){
        e.hp -= (e.type==="brute"?12:14);
        e.stun = 0.16;
        e.hitFlash = 0.12;
        e.vx += hero.facing * 220;
        hitSomething=true;
        game.score += 60;
        spawnImpact(e.x+e.w/2, e.y+e.h/2, 10, "cyan");
        SND.fx.hit();
        addHit();
        if(e.hp<=0){
          e.dead=true;
          game.score += 140;
          spawnImpact(e.x+e.w/2, e.y+e.h/2, 26, "purple");
        }
      }
    }

    if(boss && !boss.dead){
      if(aabb(hb.x,hb.y,hb.w,hb.h, boss.x,boss.y,boss.w,boss.h)){
        boss.hp -= 10;
        boss.hitFlash = 0.12;
        hitSomething=true;
        game.score += 80;
        spawnImpact(boss.x+boss.w/2, boss.y+boss.h/2, 14, "cyan");
        SND.fx.hit();
        addHit();
        shake(0.09, 5);
        if(boss.hp<=0){
          boss.dead=true;
          toCutscene();
        }
      }
    }

    if(hitSomething) shake(0.06, 4);
  }

  function addHit(){
    hero.hits += 1;
    // power rule: 10 consecutive hits AND no damage taken since streak began
    if(hero.tookDamage){
      hero.power = 0;
      hero.tookDamage = false; // streak restarts now
    }
    hero.power += 1;
    if(hero.power >= 10 && !hero.powerReady){
      hero.powerReady = true;
      setMsg("POWER MODE READY!", 1.0);
      SND.fx.power();
      spawnButterflies(hero.x+hero.w/2, hero.y+10, 12);
      shake(0.12, 6);
    }
  }

  function doSpecial(){
    if(!hero.powerReady || hero.actionT>0) return;
    hero.powerReady=false;
    hero.power=0;
    hero.actionT=0.55;
    SND.fx.special();
    setMsg("BUTTERFLY BURST!", 1.0);
    shake(0.18, 10);

    // sweeping hit area
    const sx = hero.x + (hero.facing===1 ? 0 : -240);
    const sy = hero.y + 10;
    const sw = 240, sh = 70;

    spawnButterflies(hero.x+hero.w/2, hero.y+8, 30);

    for(const e of enemies){
      if(e.dead) continue;
      if(aabb(sx,sy,sw,sh, e.x,e.y,e.w,e.h)){
        e.hp -= (e.type==="brute"?60:80);
        e.stun = 0.35;
        e.hitFlash=0.18;
        e.vx += hero.facing*520;
        spawnImpact(e.x+e.w/2, e.y+e.h/2, 22, "pink");
        if(e.hp<=0){ e.dead=true; game.score+=180; spawnImpact(e.x+e.w/2, e.y+e.h/2, 40, "purple"); }
      }
    }

    if(boss && !boss.dead){
      if(aabb(sx,sy,sw,sh, boss.x,boss.y,boss.w,boss.h)){
        boss.hp -= 80;
        boss.hitFlash=0.18;
        spawnImpact(boss.x+boss.w/2, boss.y+boss.h/2, 40, "pink");
        if(boss.hp<=0){ boss.dead=true; toCutscene(); }
      }
    }
  }

  // ============================================================
  // CUTSCENE / REWARD
  // ============================================================
  function toCutscene(){
    game.state="cutscene";
    game.cutT=0;
    game.bossRevealStep=0;
    setMsg("THE MONARCH COLLAPSES…", 1.4);
    SND.fx.slam();
    SND.setMode("boss");
    shake(0.22, 14);
    spawnImpact(boss.x+boss.w/2, boss.y+boss.h/2, 120, "purple");
  }

  // ============================================================
  // BACKGROUND PARALLAX (Haywards Heath vibe)
  // ============================================================
  function drawParallax(){
    const t=nowS();
    // SKY
    const sky=ctx.createLinearGradient(0,0,0,VIEW_H);
    sky.addColorStop(0,"#0c0f2e");
    sky.addColorStop(0.55,"#25114a");
    sky.addColorStop(1,"#05060a");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,VIEW_W,VIEW_H);

    // stars drifting (slow)
    ctx.save();
    ctx.globalAlpha=0.7;
    const px = (cam.x*0.10);
    for(let i=0;i<120;i++){
      const x = (i*131 + px) % VIEW_W;
      const y = (i*67) % 240;
      ctx.fillStyle = (i%13===0) ? "rgba(190,240,255,.9)" : "rgba(255,255,255,.55)";
      ctx.fillRect(x,y,2,2);
    }
    ctx.restore();

    // cosmic rift (very slow pulse)
    ctx.save();
    ctx.globalAlpha=0.22;
    ctx.fillStyle="rgba(170,90,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(VIEW_W*0.78,VIEW_H*0.16,270,150,Math.sin(t*0.7)*0.08,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // MID: skyline silhouettes
    ctx.save();
    ctx.translate(-(cam.x*0.22),0);
    for(let i=0;i<16;i++){
      const bx=i*520+20, by=170+(i%4)*8, bw=480, bh=280;
      ctx.fillStyle=i%2===0?"#241650":"#1a143b";
      ctx.fillRect(bx,by,bw,bh);
      // windows
      ctx.globalAlpha=0.12;
      for(let r=0;r<4;r++){
        for(let c=0;c<7;c++){
          if((r+c+i)%3===0) continue;
          ctx.fillStyle="rgba(255,230,170,1)";
          ctx.fillRect(bx+40+c*60, by+40+r*46, 18, 16);
        }
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();

    // FRONT: shopfronts + lamps
    ctx.save();
    ctx.translate(-(cam.x*0.55),0);
    const baseY = GROUND_Y - 215;
    for(let i=0;i<12;i++){
      const sx0=i*560 + 80;
      const w=520,h=240;

      // building
      ctx.fillStyle = i%2===0 ? "rgba(45,140,180,.45)" : "rgba(120,70,180,.45)";
      ctx.fillRect(sx0, baseY, w, h);

      // sign
      ctx.fillStyle="rgba(255,255,255,.08)";
      ctx.fillRect(sx0+18, baseY+18, w-36, 36);

      ctx.font="14px ui-monospace";
      ctx.fillStyle = i%3===0 ? "rgba(120,255,220,.85)" : i%3===1 ? "rgba(255,190,120,.80)" : "rgba(220,140,255,.80)";
      const name = (i%5===0)?"CAFÉ":(i%5===1)?"BOOKS":(i%5===2)?"BAKERY":(i%5===3)?"PHARMACY":"GAMES";
      ctx.fillText(`${name} • HAYWARDS`, sx0+34, baseY+42);

      // windows
      ctx.fillStyle="rgba(120,200,255,.10)";
      ctx.fillRect(sx0+44, baseY+78, 180, 125);
      ctx.fillRect(sx0+255, baseY+78, 220, 125);

      // door
      ctx.fillStyle="rgba(10,10,18,.55)";
      ctx.fillRect(sx0+230, baseY+95, 16, 110);

      // fairy lights
      ctx.globalAlpha=0.85;
      for(let k=0;k<16;k++){
        const lx=sx0+24+k*30;
        const ly=baseY+66 + Math.sin((t*2)+(k*0.7)+i)*2;
        ctx.fillStyle = (k%3===0)?"rgba(255,80,200,.65)":(k%3===1)?"rgba(80,220,255,.55)":"rgba(255,220,120,.55)";
        ctx.fillRect(lx,ly,6,6);
      }
      ctx.globalAlpha=1;

      // lamp post
      ctx.fillStyle="rgba(255,255,255,.10)";
      ctx.fillRect(sx0+w-46, baseY+70, 8, 150);
      ctx.fillStyle="rgba(255,220,120,.14)";
      ctx.fillRect(sx0+w-58, baseY+50, 34, 24);
    }
    ctx.restore();

    // STREET + tiles
    ctx.fillStyle="#0c0c14";
    ctx.fillRect(0,GROUND_Y,VIEW_W,VIEW_H-GROUND_Y);

    ctx.save();
    ctx.globalAlpha=0.12;
    ctx.strokeStyle="rgba(255,255,255,.25)";
    for(let x=0;x<VIEW_W;x+=36){
      ctx.beginPath(); ctx.moveTo(x,GROUND_Y+10); ctx.lineTo(x,VIEW_H); ctx.stroke();
    }
    for(let y=GROUND_Y+18;y<VIEW_H;y+=28){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VIEW_W,y); ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================
  // SPRITES (pixel art feel via chunky shapes + outlines)
  // TMNT/Simpsons-ish: thick outlines, bright fills, bouncy motion
  // ============================================================
  function drawShadow(x,y,w){
    ctx.save();
    ctx.globalAlpha=0.25;
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.ellipse(x+w/2, y+hero.h+6, w*0.62, 9, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawHero(){
    const px = hero.x - cam.x;
    const py = hero.y;
    const t = nowS();

    // bounce
    const moving = Math.abs(hero.vx) > 10;
    const frame = moving ? Math.floor(hero.animT*10)%4 : 0;
    const bob = moving ? Math.sin(hero.animT*16)*2 : Math.sin(hero.animT*4)*0.6;

    drawShadow(px,py,hero.w*2);

    ctx.save();
    ctx.translate(Math.floor(px), Math.floor(py + bob));
    ctx.scale(hero.facing, 1);
    ctx.imageSmoothingEnabled=false;

    // outlines
    const OUT="rgba(0,0,0,.65)";

    // legs (2 tones for cartoony shading)
    const legA = frame===1 || frame===3 ? 3 : 0;
    const legB = frame===2 ? 4 : 1;

    ctx.fillStyle=OUT;
    ctx.fillRect(-2, 52, 16, 24);
    ctx.fillRect(26, 52, 16, 24);

    ctx.fillStyle="#1a8f4c";
    ctx.fillRect(0, 54+legA, 12, 20-legA);
    ctx.fillRect(28, 54+legB, 12, 20-legB);

    // boots
    ctx.fillStyle=OUT;
    ctx.fillRect(-1, 71, 14, 6);
    ctx.fillRect(27, 71, 14, 6);
    ctx.fillStyle="#2a2d3a";
    ctx.fillRect(0, 72, 12, 4);
    ctx.fillRect(28, 72, 12, 4);

    // body (green outfit)
    ctx.fillStyle=OUT;
    ctx.fillRect(-3, 20, 46, 38);

    ctx.fillStyle="#2ecc71";
    ctx.fillRect(0, 23, 40, 32);

    // belt
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.fillRect(0, 43, 40, 4);
    ctx.fillStyle="rgba(255,255,255,.15)";
    ctx.fillRect(2, 44, 36, 2);

    // arms (bouncy)
    const armSwing = moving ? Math.sin(hero.animT*16)*3 : 0;
    ctx.fillStyle=OUT;
    ctx.fillRect(-12, 26, 14, 12);
    ctx.fillRect(40, 26, 14, 12);
    ctx.fillStyle="#2ecc71";
    ctx.fillRect(-10, 28+armSwing*0.3, 10, 8);
    ctx.fillRect(40, 28-armSwing*0.3, 10, 8);

    // hands
    ctx.fillStyle="#f2c7a7";
    ctx.fillRect(-12, 34+armSwing*0.3, 6, 6);
    ctx.fillRect(48, 34-armSwing*0.3, 6, 6);

    // head
    ctx.fillStyle=OUT;
    ctx.fillRect(2, 0, 36, 24);
    ctx.fillStyle="#f2c7a7";
    ctx.fillRect(4, 2, 32, 20);

    // hair (long dark, trailing)
    const hairWave = Math.sin(t*3 + hero.animT)*2;
    ctx.fillStyle=OUT;
    ctx.fillRect(0, -4, 40, 16);
    ctx.fillStyle="#1b1b1b";
    ctx.fillRect(2, -2, 36, 12);
    ctx.fillRect(30, 10, 14, 18); // longer tail

    // eyes + mouth
    ctx.fillStyle="#0b0b12";
    ctx.fillRect(12, 10, 4, 4);
    ctx.fillRect(24, 10, 4, 4);
    ctx.fillStyle="#d26b7a";
    ctx.fillRect(16, 18, 10, 2);

    // POWER glow
    if(hero.powerReady){
      ctx.globalAlpha=0.25 + 0.1*Math.sin(t*10);
      ctx.fillStyle="rgba(120,255,190,1)";
      ctx.fillRect(-6,-6,52,86);
      ctx.globalAlpha=1;
    }

    // attack pose
    if(hero.actionT>0.01){
      ctx.fillStyle="rgba(255,255,255,.12)";
      ctx.fillRect(40, 26, 18, 10);
    }

    // inv flash
    if(hero.inv>0 && (Math.floor(t*16)%2===0)){
      ctx.globalAlpha=0.35;
      ctx.fillStyle="#fff";
      ctx.fillRect(-8,-8,60,90);
      ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  function drawEnemy(e){
    const x = e.x - cam.x;
    const y = e.y;
    const t = nowS();
    const brute = e.type==="brute";

    // idle / walk bob
    const moving = Math.abs(e.vx) > 8;
    const frame = moving ? Math.floor(e.animT*10)%4 : Math.floor(e.animT*4)%2;
    const bob = moving ? Math.sin(e.animT*14)*2 : Math.sin(e.animT*3)*1;

    // attack lunge
    const lunge = (e.atkT < 0.18 && e.atkT > 0) ? (1 - e.atkT/0.18) * 6 : 0;

    ctx.save();
    ctx.translate(Math.floor(x + (e.vx>0?1:-1)*lunge), Math.floor(y + bob));
    ctx.imageSmoothingEnabled=false;

    const OUT="rgba(0,0,0,.70)";
    const body = brute ? "#8a1aa6" : "#124c9a";
    const glow = brute ? "rgba(255,80,220,.90)" : "rgba(80,240,255,.90)";

    // outline
    ctx.fillStyle=OUT;
    ctx.fillRect(-3,-3,e.w+6,e.h+6);

    // body
    ctx.fillStyle=body;
    ctx.fillRect(0, 18, e.w, e.h-18);

    // head
    ctx.fillStyle=glow;
    ctx.fillRect(6, 4, e.w-12, 14);

    // horns
    ctx.fillStyle=OUT;
    ctx.fillRect(4, 0, 8, 8);
    ctx.fillRect(e.w-12, 0, 8, 8);

    // eyes (blink)
    const blink = (Math.floor(t*2 + e.animT)%6===0);
    ctx.fillStyle="rgba(255,60,60,.95)";
    if(!blink){
      ctx.fillRect(12, 10, 4, 3);
      ctx.fillRect(e.w-16, 10, 4, 3);
    } else {
      ctx.fillRect(12, 11, 4, 1);
      ctx.fillRect(e.w-16, 11, 4, 1);
    }

    // mouth/teeth
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(12, 20, e.w-24, 6);
    ctx.fillStyle="rgba(255,255,255,.65)";
    for(let i=0;i<5;i++) ctx.fillRect(14+i*4, 22, 2, 2);

    // tendrils / arms (animated)
    const tend = (frame%2===0) ? 0 : 2;
    ctx.fillStyle = brute ? "rgba(200,80,255,.35)" : "rgba(80,220,255,.30)";
    ctx.fillRect(-8, 40+tend, 10, 22);
    ctx.fillRect(e.w-2, 40-tend, 10, 22);

    // hit flash
    if(e.hitFlash>0){
      ctx.globalAlpha=0.35;
      ctx.fillStyle="rgba(255,255,255,1)";
      ctx.fillRect(-6,-6,e.w+12,e.h+12);
      ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  function drawBoss(){
    if(!boss || boss.dead) return;
    const bx = boss.x - cam.x;
    const by = boss.y;
    const t = nowS();
    boss.animT += 1/60;

    // huge shadow
    ctx.save();
    ctx.globalAlpha=0.28;
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.ellipse(bx+boss.w/2, GROUND_Y+10, boss.w*0.72, 18, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(Math.floor(bx), Math.floor(by));
    ctx.imageSmoothingEnabled=false;

    const OUT="rgba(0,0,0,.75)";
    const corePulse = 0.35 + 0.15*Math.sin(t*6);
    const crackPulse = 0.12 + 0.10*Math.sin(t*10);

    // outline
    ctx.fillStyle=OUT;
    ctx.fillRect(-5,-5,boss.w+10,boss.h+10);

    // body (chunky, cartoony)
    ctx.fillStyle = "rgba(60,0,110,.95)";
    ctx.fillRect(0, 30, boss.w, boss.h-30);

    // shoulders
    ctx.fillStyle="rgba(90,0,150,.90)";
    ctx.fillRect(0, 30, boss.w, 30);

    // head crest
    ctx.fillStyle="rgba(255,80,255,.85)";
    ctx.fillRect(boss.w/2-40, 0, 80, 34);

    // eyes
    ctx.fillStyle="rgba(80,240,255,.90)";
    ctx.fillRect(boss.w/2-48, 48, 22, 10);
    ctx.fillRect(boss.w/2+26, 48, 22, 10);

    // core
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = `rgba(255,120,255,${corePulse})`;
    ctx.fillRect(boss.w/2-18, 88, 36, 36);
    ctx.globalAlpha=1;

    // cracks when low HP
    if(boss.hp < 260){
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = `rgba(120,255,220,${crackPulse})`;
      ctx.fillRect(24, 78, 10, 60);
      ctx.fillRect(boss.w-34, 92, 10, 70);
      ctx.globalAlpha=1;
    }
    if(boss.hp < 140){
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = `rgba(255,220,120,${crackPulse})`;
      ctx.fillRect(boss.w/2-4, 40, 8, 150);
      ctx.globalAlpha=1;
    }

    // slam windup indicator
    if(boss.slamWind>0){
      ctx.globalAlpha=0.25;
      ctx.fillStyle="rgba(255,80,200,1)";
      ctx.fillRect(-10, boss.h-70, boss.w+20, 70);
      ctx.globalAlpha=1;
    }

    // hit flash
    if(boss.hitFlash>0 && (Math.floor(t*18)%2===0)){
      ctx.globalAlpha=0.28;
      ctx.fillStyle="#fff";
      ctx.fillRect(-10,-10,boss.w+20,boss.h+20);
      ctx.globalAlpha=1;
    }

    ctx.restore();

    // boss HP bar
    ctx.save();
    const bw=320, bh=12;
    const x=VIEW_W/2 - bw/2, y=66;
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(x,y,bw,bh);
    ctx.fillStyle="rgba(255,120,255,.78)"; ctx.fillRect(x,y,bw*(boss.hp/520),bh);
    ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.font="12px ui-monospace";
    ctx.fillText("THE DARK MATTER MONARCH", x+8, y-6);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = 1 - (p.t/p.life);
      ctx.save();
      ctx.globalAlpha = a*0.9;

      if(p.color==="butterfly"){
        // tiny butterfly-like pixels
        const x=p.x-cam.x, y=p.y;
        const s = 2;
        const w = 8;
        const flap = Math.sin(p.spin + p.t*10)*2;
        ctx.fillStyle="rgba(255,190,240,.85)";
        ctx.fillRect(x-w/2, y, s*2, s*2);
        ctx.fillRect(x+w/2-s*2, y, s*2, s*2);
        ctx.fillStyle="rgba(120,255,220,.85)";
        ctx.fillRect(x-w/2, y+flap, s*2, s*2);
        ctx.fillRect(x+w/2-s*2, y-flap, s*2, s*2);
        ctx.fillStyle="rgba(255,255,255,.55)";
        ctx.fillRect(x, y+1, 2, 4);
      } else {
        ctx.fillStyle =
          p.color==="red" ? "rgba(255,120,120,.9)" :
          p.color==="cyan" ? "rgba(120,240,255,.9)" :
          p.color==="pink" ? "rgba(255,140,255,.9)" :
          "rgba(190,120,255,.9)";
        ctx.fillRect(p.x-cam.x, p.y, 2, 2);
      }

      ctx.restore();
    }
  }

  function drawCutscene(){
    drawParallax();
    // dark overlay
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.restore();

    // transformation staging
    const centerX = VIEW_W/2;
    const baseY = 300;

    if(game.bossRevealStep===0){
      // collapsing monarch silhouette
      ctx.save();
      ctx.globalAlpha=0.9;
      ctx.fillStyle="rgba(255,120,255,.22)";
      ctx.fillRect(centerX-140, baseY-140, 280, 200);
      ctx.restore();

      ctx.font="18px ui-monospace";
      ctx.fillStyle="rgba(255,255,255,.92)";
      ctx.fillText("The Dark Matter Monarch… collapses.", 270, 140);

      ctx.font="14px ui-monospace";
      ctx.fillStyle="rgba(255,255,255,.70)";
      ctx.fillText("Tap to continue", 410, 460);
    }

    if(game.bossRevealStep===1){
      // morph effect + particles
      ctx.save();
      ctx.globalAlpha=0.35;
      ctx.fillStyle="rgba(255,80,200,1)";
      ctx.fillRect(centerX-170, baseY-170, 340, 240);
      ctx.restore();

      drawProfCoxSprite(centerX-50, baseY-120);

      ctx.font="18px ui-monospace";
      ctx.fillStyle="rgba(255,255,255,.92)";
      ctx.fillText("…wait. That’s not a monarch.", 300, 140);
      ctx.font="14px ui-monospace";
      ctx.fillStyle="rgba(255,255,255,.70)";
      ctx.fillText("Tap to continue", 410, 460);
    }

    if(game.bossRevealStep===2){
      drawProfCoxSprite(centerX-50, baseY-120);

      // dialogue box
      ctx.save();
      ctx.fillStyle="rgba(0,0,0,.78)";
      ctx.fillRect(120, 360, 720, 130);
      ctx.strokeStyle="rgba(255,255,255,.14)";
      ctx.strokeRect(120, 360, 720, 130);
      ctx.restore();

      ctx.fillStyle="rgba(255,255,255,.94)";
      ctx.font="16px ui-monospace";
      ctx.fillText("Professor Brian Cox:", 140, 388);

      const lines = [
        "“Ah… thank you. That dark matter crisis was getting rather out of hand.”",
        "“You’ve saved more than just Haywards Heath.”",
        "“You’ve saved the universe.”"
      ];

      ctx.font="14px ui-monospace";
      let y=412;
      for(const L of lines){
        const wrapped = wrapLines(L, 680, 14);
        for(const w of wrapped){
          ctx.fillStyle="rgba(255,255,255,.86)";
          ctx.fillText(w, 140, y);
          y += 20;
        }
      }

      ctx.font="14px ui-monospace";
      ctx.fillStyle="rgba(255,255,255,.70)";
      ctx.fillText("Tap to claim your reward", 360, 480);
    }
  }

  function drawReward(){
    drawParallax();

    // soft overlay
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.60)";
    ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.restore();

    // card
    const pad=26;
    const boxX=pad;
    const boxY=70;
    const boxW=VIEW_W-pad*2;
    const boxH=VIEW_H-120;

    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.80)";
    ctx.fillRect(boxX,boxY,boxW,boxH);
    ctx.strokeStyle="rgba(255,255,255,.18)";
    ctx.strokeRect(boxX,boxY,boxW,boxH);

    // reveal pacing
    const showLines = Math.floor(game.revealT * 5.2);

    const content = [
      "REWARD UNLOCKED",
      "🎟️ TWO TICKETS 🎟️",
      "Brian Cox: Emergence — Live in Brighton",
      "",
      "Merry Christmas, Charlotte 🦋",
      "— Love you always, Nick x"
    ];

    let printed=0;
    let y=boxY+76;

    for(const row of content){
      if(printed >= showLines) break;

      const font = row==="REWARD UNLOCKED" ? 26 : (row.includes("TICKETS")?20:18);
      ctx.font=`${font}px ui-monospace`;

      let color="rgba(255,255,255,.92)";
      if(row.includes("TICKETS")) color="rgba(255,200,120,.95)";
      if(row.includes("Emergence")) color="rgba(120,255,220,.92)";
      if(row.includes("🦋")) color="rgba(255,190,240,.92)";
      ctx.fillStyle=color;

      const w=ctx.measureText(row).width;
      ctx.fillText(row, VIEW_W/2 - w/2, y);

      y += (row===""?16:(font===26?42:34));
      printed++;
    }

    ctx.font="14px ui-monospace";
    ctx.fillStyle="rgba(255,255,255,.70)";
    ctx.fillText("Tap to reveal faster", boxX+22, boxY+boxH-18);

    ctx.restore();

    // butterflies drifting
    if(Math.random() < 0.25){
      spawnButterflies(cam.x + VIEW_W/2, 180, 1);
      SND.fx.sparkle();
    }
  }

  // ============================================================
  // GAME LOOP / UPDATE
  // ============================================================
  const DT = 1/60;
  let last=performance.now(), acc=0;

  function update(){
    const t=nowS();

    // global timers
    if(game.msgT>0) game.msgT -= DT;
    if(game.shakeT>0) game.shakeT -= DT;
    hero.inv = Math.max(0, hero.inv - DT);
    hero.actionT = Math.max(0, hero.actionT - DT);
    hero.dashT = Math.max(0, hero.dashT - DT);

    // input edges
    if(v.muteHit){ SND.toggleMute(); v.muteHit=false; }

    // state flow
    if(game.state==="title"){
      SND.setMode("title");
      clearEdges();
      return;
    }

    if(game.state==="cutscene"){
      game.cutT += DT;
      // particles still animate
      updateParticles();
      // camera soft center
      cam.x = lerp(cam.x, clamp((WORLD_W-720) - VIEW_W/2, 0, WORLD_W - VIEW_W), 0.08);
      clearEdges();
      return;
    }

    if(game.state==="reward"){
      game.revealT += DT;
      updateParticles();
      clearEdges();
      return;
    }

    // gameplay music mode
    if(game.state==="wave") SND.setMode("stage");
    if(game.state==="boss") SND.setMode("boss");

    // hero movement
    const ax = (v.left?-1:0) + (v.right?1:0);
    const maxSp = (hero.actionT>0) ? 160 : 260;
    const target = ax * maxSp;
    hero.vx = lerp(hero.vx, target, 0.22);
    if(ax!==0) hero.facing = ax>0 ? 1 : -1;

    // dash
    if(v.dashHit && hero.dashT<=0 && hero.actionT<=0){
      hero.dashT = 0.18;
      hero.vx = hero.facing * 620;
      shake(0.06, 5);
      v.dashHit=false;
    }

    // jump
    if(v.jumpHit && hero.onGround && hero.actionT<=0){
      hero.vy = -520;
      hero.onGround=false;
      SND.fx.jump();
    }

    // gravity
    hero.vy += 980*DT;

    // integrate
    hero.x += hero.vx*DT;
    hero.y += hero.vy*DT;

    // floor
    const floor = GROUND_Y - hero.h;
    if(hero.y >= floor){
      hero.y = floor;
      hero.vy = 0;
      hero.onGround = true;
    } else hero.onGround=false;

    // clamp hero to world
    hero.x = clamp(hero.x, 0, WORLD_W-hero.w);

    // actions
    if(v.attackHit) doAttack();
    if(v.specialHit) doSpecial();

    // enemies AI (waves)
    if(game.state==="wave"){
      // spawn initial wave if empty
      if(enemies.length===0){
        startWave(1);
      }

      // update each enemy
      for(const e of enemies){
        if(e.dead) continue;

        e.animT += DT;
        e.stun = Math.max(0, e.stun - DT);
        e.atkT = Math.max(0, e.atkT - DT);
        e.hitFlash = Math.max(0, e.hitFlash - DT);

        const dx = (hero.x - e.x);
        const dir = dx>0 ? 1 : -1;

        if(e.stun>0){
          e.vx = lerp(e.vx, 0, 0.18);
        } else {
          // approach
          const sp = e.type==="brute" ? 110 : 160;
          e.vx = lerp(e.vx, dir*sp, 0.08);

          // attack
          const range = e.type==="brute" ? 62 : 52;
          if(Math.abs(dx) < range && e.atkT<=0){
            e.atkT = e.type==="brute" ? 0.95 : 0.75;
            // damage check
            if(aabb(e.x, e.y, e.w, e.h, hero.x, hero.y, hero.w, hero.h)){
              damageHero(e.type==="brute" ? 18 : 10);
            }
          }
        }

        // integrate
        e.x += e.vx * DT;
        e.x = clamp(e.x, 0, WORLD_W - e.w);
      }

      // wave complete?
      if(enemies.every(e=>e.dead)){
        if(game.wave < 3){
          game.wave += 1;
          startWave(game.wave);
        } else {
          // move to boss arena
          game.state="boss";
          spawnBoss();
          setMsg("ENTERING BOSS ZONE…", 1.2);
        }
      }
    }

    // boss logic
    if(game.state==="boss" && boss && !boss.dead){
      boss.animT += DT;
      boss.hitFlash = Math.max(0, boss.hitFlash - DT);
      boss.atkT = Math.max(0, boss.atkT - DT);
      boss.slamWind = Math.max(0, boss.slamWind - DT);

      // phase
      boss.phase = boss.hp < 260 ? 2 : 1;
      if(boss.hp < 140) boss.phase = 3;

      // move toward hero
      const dx = hero.x - boss.x;
      const dir = dx>0 ? 1 : -1;
      const sp = boss.phase===1 ? 90 : (boss.phase===2 ? 115 : 140);
      boss.x += dir*sp*DT;
      boss.x = clamp(boss.x, WORLD_W-900, WORLD_W-200);

      // slam pattern
      if(Math.abs(dx) < 220 && boss.atkT<=0){
        boss.atkT = boss.phase===3 ? 0.9 : 1.15;
        boss.slamWind = 0.26;

        // on impact after windup
        setTimeout(()=>{
          if(game.state!=="boss" || !boss || boss.dead) return;
          SND.fx.slam();
          shake(0.22, 14);
          spawnImpact(boss.x+boss.w/2, GROUND_Y-10, 60, "purple");

          // area damage
          const areaX = boss.x - 110;
          const areaW = boss.w + 220;
          if(aabb(areaX, GROUND_Y-110, areaW, 110, hero.x, hero.y, hero.w, hero.h)){
            damageHero(boss.phase===3?26:20);
          }
        }, 220);
      }
    }

    // particles
    updateParticles();

    // camera follows hero but clamped
    cam.x = lerp(cam.x, clamp(hero.x - 420, 0, WORLD_W - VIEW_W), 0.12);

    // UI
    UI.hp.textContent = `HP: ${Math.ceil(hero.hp)}`;
    UI.combo.textContent = `HITS: ${hero.hits}`;
    UI.power.textContent = hero.powerReady ? `POWER: READY!` : `POWER: ${Math.min(hero.power,10)}/10`;
    UI.stage.textContent = boss && game.state==="boss" ? `BOSS` : `WAVE: ${game.wave}/3`;
    UI.score.textContent = `SCORE: ${game.score}`;

    clearEdges();
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.t += DT;
      p.vy += 520*DT;
      p.x += p.vx*DT;
      p.y += p.vy*DT;
      if(p.color==="butterfly"){
        p.spin += DT*6;
        p.vx *= 0.985;
        p.vy *= 0.99;
      }
      if(p.t >= p.life) particles.splice(i,1);
    }
  }

  function render(){
    // shake
    let sx=0, sy=0;
    if(game.shakeT>0){
      const m=game.shakeM*(game.shakeT/0.22);
      sx=rnd(-m,m); sy=rnd(-m,m);
    }

    // clear real canvas
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // transform to virtual view
    ctx.setTransform(view.s,0,0,view.s,view.ox,view.oy);
    ctx.translate(sx,sy);

    if(game.state==="title"){
      drawTitle();
      drawCRT();
      return;
    }

    // main scene
    drawParallax();

    // set dressing: a “Brighton →” sign near end
    if(cam.x > WORLD_W-1400){
      const sx2 = (WORLD_W-980) - cam.x;
      ctx.save();
      ctx.globalAlpha=0.92;
      ctx.fillStyle="rgba(255,255,255,.08)";
      ctx.fillRect(sx2, 220, 300, 44);
      ctx.fillStyle="rgba(255,255,255,.75)";
      ctx.font="14px ui-monospace";
      ctx.fillText("BRIGHTON → (via cosmic shortcut)", sx2+16, 248);
      ctx.restore();
    }

    drawHero();

    for(const e of enemies) if(!e.dead) drawEnemy(e);
    drawBoss();

    drawParticles();
    drawMessage();

    if(game.state==="cutscene") drawCutscene();
    if(game.state==="reward") drawReward();

    drawCRT();
  }

  function drawCRT(){
    ctx.save();
    ctx.globalAlpha=0.10; ctx.fillStyle="#000";
    for(let y=0;y<VIEW_H;y+=3) ctx.fillRect(0,y,VIEW_W,1);
    ctx.globalAlpha=0.06; ctx.fillStyle="#fff";
    for(let y=1;y<VIEW_H;y+=7) ctx.fillRect(0,y,VIEW_W,1);
    const g=ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,60,VIEW_W/2,VIEW_H/2,VIEW_W/1.1);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0,0.55)");
    ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.restore();
  }

  // ============================================================
  // TITLE -> START / CUTSCENE -> REWARD tap handling
  // ============================================================
  canvas.addEventListener("pointerdown", ()=>{
    if(game.state==="title"){
      // Start
      SND.ensure();
      SND.resume();
      SND.musicStart();
      SND.fx.start();
      SND.setMode("stage");

      game.state="wave";
      game.wave=1;
      hero.hp=100; hero.inv=0;
      hero.hits=0; hero.power=0; hero.powerReady=false; hero.tookDamage=false;
      game.score=0;
      enemies.length=0;
      boss=null;
      startWave(1);
      setMsg("STAGE START: HAYWARDS HEATH HIGH STREET", 1.6);
      return;
    }
    if(game.state==="cutscene"){
      game.bossRevealStep = clamp(game.bossRevealStep+1, 0, 2);
      if(game.bossRevealStep===2){
        // proceed on next tap to reward
        // (we keep step 2 until next tap)
      } else if(game.bossRevealStep===1){
        // sprinkle
        spawnImpact(cam.x + VIEW_W/2, 240, 24, "pink");
      }
      return;
    }
    if(game.state==="cutscene" && game.bossRevealStep===2){
      // unreachable due to return above, but kept safe
      return;
    }
    if(game.state==="cutscene" && game.bossRevealStep===2){
      return;
    }
  }, {passive:true});

  // Special: handle the “tap to claim reward” at step 2 and reward reveal acceleration
  canvas.addEventListener("pointerdown", ()=>{
    if(game.state==="cutscene" && game.bossRevealStep===2){
      // to reward
      game.state="reward";
      game.revealT=0;
      SND.setMode("reveal");
      spawnButterflies(cam.x + VIEW_W/2, 220, 18);
      SND.fx.sparkle();
      return;
    }
    if(game.state==="reward"){
      game.revealT += 1.8;
      spawnButterflies(cam.x + VIEW_W/2, 200, 3);
      SND.fx.sparkle();
    }
  }, {passive:true});

  // ============================================================
  // MAIN LOOP
  // ============================================================
  function loop(ts){
    acc += (ts-last)/1000;
    last = ts;
    while(acc>=DT){ update(); acc -= DT; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
