

<!doctype html>
<html lang="en">
<head>


  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Charlotte vs The Dark Matter Crisis</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#05060a; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    canvas { width:100vw; height:100vh; touch-action:none; }
    /* soft vignette for “gamey” look */
    #vignette { pointer-events:none; position:fixed; inset:0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="vignette"></div>

<script>
(() => {
  // =============================
  // CONFIG (safe defaults)
  // =============================
  const ASSETS = {
    bg:     "assets/bg.png",
    title:  "assets/title.png",
    char:   "assets/charlotte.png",
    mutant: "assets/mutant.png",
    boss:   "assets/boss.png",
  };

  // Base portrait “design resolution” (renders crisp & scales to device)
  const BASE_W = 390;   // iPhone-ish
  const BASE_H = 844;

  // UI layout split
  const HUD_H = 120;        // top HUD
  const CONTROLS_H = 210;   // bottom controls
  const PLAY_TOP = HUD_H;
  const PLAY_BOT = BASE_H - CONTROLS_H;

  // Movement tuning
  const GRAVITY = 2400;
  const FLOOR_Y = PLAY_BOT - 18;

  // Game progression
  const WAVES_TOTAL = 3;

  // Special move rule: 10 hits + no damage taken during charge window
  const SPECIAL_HITS_REQUIRED = 10;

  // =============================
  // CANVAS / SCALE
  // =============================
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // Render at device pixel ratio for crispness
  function resize() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); // draw in CSS pixels
  }
  window.addEventListener("resize", resize, {passive:true});
  resize();

  // Fit BASE_W x BASE_H into viewport with letterboxing (keeps portrait)
  function getFit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / BASE_W, vh / BASE_H);
    const ox = (vw - BASE_W * scale) / 2;
    const oy = (vh - BASE_H * scale) / 2;
    return { scale, ox, oy };
  }

  // Helper to draw in “game coords”
  function withGameTransform(fn) {
    const {scale, ox, oy} = getFit();
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    fn();
    ctx.restore();
  }

  // =============================
  // AUDIO (no files needed)
  // =============================
  let audioCtx = null;
  let musicOn = true;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function sfx(type="blip") {
    if (!musicOn) return;
    ensureAudio();
    const t0 = audioCtx.currentTime;

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);

    if (type === "hit") {
      o.type = "square";
      o.frequency.setValueAtTime(220, t0);
      o.frequency.exponentialRampToValueAtTime(120, t0 + 0.06);
      g.gain.setValueAtTime(0.18, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
      o.start(t0); o.stop(t0 + 0.09);
      return;
    }

    if (type === "hurt") {
      o.type = "sawtooth";
      o.frequency.setValueAtTime(180, t0);
      o.frequency.exponentialRampToValueAtTime(60, t0 + 0.12);
      g.gain.setValueAtTime(0.22, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
      o.start(t0); o.stop(t0 + 0.15);
      return;
    }

    if (type === "jump") {
      o.type = "triangle";
      o.frequency.setValueAtTime(420, t0);
      o.frequency.exponentialRampToValueAtTime(760, t0 + 0.07);
      g.gain.setValueAtTime(0.10, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
      o.start(t0); o.stop(t0 + 0.1);
      return;
    }

    if (type === "special") {
      o.type = "square";
      o.frequency.setValueAtTime(300, t0);
      o.frequency.exponentialRampToValueAtTime(900, t0 + 0.18);
      g.gain.setValueAtTime(0.18, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
      o.start(t0); o.stop(t0 + 0.23);
      return;
    }

    // default “blip”
    o.type = "square";
    o.frequency.setValueAtTime(520, t0);
    g.gain.setValueAtTime(0.09, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    o.start(t0); o.stop(t0 + 0.09);
  }

  // Simple “chiptune-ish” loop
  let musicTimer = null;
  function startMusic() {
    if (!musicOn) return;
    ensureAudio();
    stopMusic();
    const seq = [440, 0, 523, 0, 659, 0, 523, 0, 392, 0, 440, 0, 523, 0, 659, 0];
    let i = 0;
    musicTimer = setInterval(() => {
      if (!musicOn || !audioCtx) return;
      const f = seq[i++ % seq.length];
      if (f === 0) return;
      const t0 = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.02, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.13);
    }, 130);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  // =============================
  // IMAGE LOADER (with fallbacks)
  // =============================
  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve({img, ok:true});
      img.onerror = () => resolve({img:null, ok:false});
      img.src = src + (src.includes("?") ? "&" : "?") + "v=" + Date.now(); // bust cache
    });
  }

  const IMG = { bg:null, title:null, char:null, mutant:null, boss:null };
  const IMG_OK = { bg:false, title:false, char:false, mutant:false, boss:false };

  async function loadAll() {
    const [bg,title,ch,mu,bo] = await Promise.all([
      loadImage(ASSETS.bg),
      loadImage(ASSETS.title),
      loadImage(ASSETS.char),
      loadImage(ASSETS.mutant),
      loadImage(ASSETS.boss),
    ]);
    IMG.bg = bg.img; IMG_OK.bg = bg.ok;
    IMG.title = title.img; IMG_OK.title = title.ok;
    IMG.char = ch.img; IMG_OK.char = ch.ok;
    IMG.mutant = mu.img; IMG_OK.mutant = mu.ok;
    IMG.boss = bo.img; IMG_OK.boss = bo.ok;
  }

  // =============================
  // INPUT (touch + mouse)
  // =============================
  const input = {
    left:false, right:false, jump:false, attack:false, special:false, grab:false,
    pressed: new Set(),
  };

  function setBtn(name, val) {
    input[name] = val;
  }

  // virtual buttons layout in game coords
  function btnRects() {
    const pad = 18;
    const y = BASE_H - CONTROLS_H + 30;

    // left cluster
    const leftW = 70, leftH = 70;
    const leftX = pad;
    const rightX = pad + leftW + 14;

    // middle
    const jumpW = 110, jumpH = 70;
    const jumpX = BASE_W/2 - jumpW/2;

    // right cluster
    const atkW=110, atkH=70;
    const atkX = BASE_W - pad - atkW*2 - 14;
    const spX  = BASE_W - pad - atkW;

    // second row
    const grabW=110, grabH=70;
    const grabX = atkX;
    const pickX = spX;

    const muteW = 110, muteH=60;
    const muteX = BASE_W/2 - muteW/2;
    const muteY = BASE_H - CONTROLS_H + 115;

    return {
      left:   {x:leftX,  y:y, w:leftW, h:leftH, label:"◀"},
      right:  {x:rightX, y:y, w:leftW, h:leftH, label:"▶"},
      jump:   {x:jumpX, y:y, w:jumpW, h:jumpH, label:"JUMP"},
      attack: {x:atkX, y:y, w:atkW, h:atkH, label:"ATTACK"},
      special:{x:spX,  y:y, w:atkW, h:atkH, label:"SPECIAL"},
      grab:   {x:grabX,y:y+86, w:grabW,h:grabH, label:"GRAB/THROW"},
      pick:   {x:pickX,y:y+86, w:grabW,h:grabH, label:"PICKUP"},
      mute:   {x:muteX,y:muteY, w:muteW,h:muteH, label: musicOn ? "MUTE" : "UNMUTE"},
    };
  }

  function hitRect(px, py, r) {
    return (px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h);
  }

  function toGameXY(clientX, clientY) {
    const {scale, ox, oy} = getFit();
    const gx = (clientX - ox) / scale;
    const gy = (clientY - oy) / scale;
    return {gx, gy};
  }

  function handlePointer(e, down) {
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const {gx, gy} = toGameXY(p.clientX, p.clientY);
    const b = btnRects();

    // map to actions
    const map = [
      ["left", b.left],
      ["right", b.right],
      ["jump", b.jump],
      ["attack", b.attack],
      ["special", b.special],
      ["grab", b.grab],
      ["pick", b.pick],
      ["mute", b.mute],
    ];

    for (const [name, r] of map) {
      if (hitRect(gx, gy, r)) {
        if (name === "mute" && down) {
          musicOn = !musicOn;
          if (musicOn) startMusic(); else stopMusic();
          sfx("blip");
        } else {
          setBtn(name, down);
          if (down) {
            ensureAudio();
            // little click sound for actions
            if (name === "jump") sfx("jump");
            if (name === "attack") sfx("blip");
            if (name === "special") sfx("blip");
          }
        }
        e.preventDefault();
        return;
      }
    }
  }

  canvas.addEventListener("touchstart", (e)=>handlePointer(e,true), {passive:false});
  canvas.addEventListener("touchend", (e)=>{
