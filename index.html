<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Dark Matter Rampage</title>
<style>
html,body{margin:0;height:100%;background:#05060a;color:#fff;font-family:system-ui;overflow:hidden}
canvas{width:100%;height:100%;touch-action:none}
#overlay{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);
  z-index:9999;
}
#card{
  padding:20px;
  background:#111;
  border-radius:16px;
  text-align:center;
}
button{
  margin:10px;
  padding:14px 18px;
  font-size:16px;
  border-radius:12px;
}
</style>
</head>
<body>

<div id="overlay">
  <div id="card">
    <h2>Dark Matter Rampage</h2>
    <p>Tap START to begin (enables sound)</p>
    <button id="start">START</button>
  </div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let started = false;
document.getElementById("start").onclick = () => {
  document.getElementById("overlay").style.display = "none";
  started = true;
};

function loop(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(started){
    ctx.fillStyle="#7cf";
    ctx.fillRect(canvas.width/2-25, canvas.height/2-25, 50, 50);
    ctx.fillText("GAME RUNNING", 20, 40);
  }
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
